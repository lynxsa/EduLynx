version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: lynxacademy_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: lynxacademydb
      POSTGRES_USER: lynxacademy
      POSTGRES_PASSWORD: lynxacademy123
    volumes:
      - lynxacademy_postgres_data:/var/lib/postgresql/data
    networks:
      - lynxacademy_network

  redis:
    image: redis:7-alpine
    container_name: lynxacademy_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - lynxacademy_redis_data:/data
    networks:
      - lynxacademy_network

volumes:
  lynxacademy_postgres_data:
  lynxacademy_redis_data:

networks:
  lynxacademy_network:
    driver: bridge
