version: '3.8'

services:
  # PostgreSQL Database for Development
  postgres:
    image: postgres:15-alpine
    container_name: edulynx_postgres_dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: edulynx_dev_db
      POSTGRES_USER: edulynx_dev
      POSTGRES_PASSWORD: dev_password_123
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./docker/postgres/init-dev.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - edulynx_dev_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edulynx_dev -d edulynx_dev_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Adminer for database management
  adminer:
    image: adminer:latest
    container_name: edulynx_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - edulynx_dev_network
    depends_on:
      - postgres

volumes:
  postgres_dev_data:
    driver: local

networks:
  edulynx_dev_network:
    driver: bridge
