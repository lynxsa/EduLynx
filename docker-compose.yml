version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: edulynx_postgres
    restart: unless-stopped
    # ports:  # using existing local DB instead
    #   - "5432:5432"
    environment:
      POSTGRES_DB: edulynx_db
      POSTGRES_USER: edulynx_user
      POSTGRES_PASSWORD: edulynx_password_2024
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - edulynx_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edulynx_user -d edulynx_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: edulynx_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - edulynx_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js Application (for production)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edulynx_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://edulynx_user:edulynx_password_2024@postgres:5432/edulynx_db
      - JWT_SECRET=edulynx_jwt_secret_key_2024_lynx_consulting_sa
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edulynx_network
    profiles:
      - production

  curriculum-service:
    build:
      context: ./packages/curriculum-service
      dockerfile: Dockerfile
    container_name: curriculum_service
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://edulynx_user:edulynx_password_2024@postgres:5432/edulynx_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edulynx_network

  assessment-service:
    build:
      context: ./packages/assessment-service
      dockerfile: Dockerfile
    container_name: assessment_service
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      - DATABASE_URL=postgresql://edulynx_user:edulynx_password_2024@postgres:5432/edulynx_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edulynx_network

  career-service:
    build:
      context: ./packages/career-service
      dockerfile: Dockerfile
    container_name: career_service
    restart: unless-stopped
    ports:
      - "4002:4002"
    environment:
      - DATABASE_URL=postgresql://edulynx_user:edulynx_password_2024@postgres:5432/edulynx_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edulynx_network

  ai-service:
    build:
      context: ./packages/ai-service
      dockerfile: Dockerfile
    container_name: ai_service
    restart: unless-stopped
    ports:
      - "4003:4003"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    networks:
      - edulynx_network

  # LMS PostgreSQL Database
  lms_postgres:
    image: postgres:15-alpine
    container_name: edulynx_lms_postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: lms_db
      POSTGRES_USER: lms_user
      POSTGRES_PASSWORD: lms_password_2025
    volumes:
      - lms_postgres_data:/var/lib/postgresql/data
    networks:
      - edulynx_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  lms_postgres_data:
    driver: local

networks:
  edulynx_network:
    driver: bridge
